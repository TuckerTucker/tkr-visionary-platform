remedy: "_compile_h3_scene writes 'At 0:04, the shot cuts to' and appends the
  shot body, which is a clause with its own verb, so the sentence reads 'cuts
  to <Subject 2> laughs'. 'the shot cuts to' is kept on purpose — one of the
  guide's five listed cut verbs — so the fix is in how the body joins it (a
  noun phrase, or a second sentence), not in the verb. The composer was just
  measured on documents that carry this, so re-run prompt_ab.py --scene after
  changing it rather than assuming grammar helps."
