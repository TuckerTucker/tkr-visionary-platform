id: work-UvrttALb
title: Inpaint pastes a whole-frame render instead of sampling from the source
kind: follow-up
severity: medium
status: closed
capabilityId: platform
anchors:
  - app.py
  - tools/smoke_graphs.py
createdAt: 2026-09-28T02:10:43.952Z
updatedAt: 2026-09-28T23:30:00.000Z
remedy: "The inpaint path samples a fresh frame from an empty latent and pastes
  only the SAM-masked area back onto the source, so the model never sees what
  surrounds the edit and light and colour can disagree across the seam. Fix it
  in _krea2_graph with core ComfyUI nodes only: LoadImage the source ->
  VAEEncode in place of EmptyHunyuanLatentVideo (RepeatLatentBatch for a batch);
  LoadImageMask -> GrowMask -> SetLatentNoiseMask on that latent; keep the
  post-decode pixel paste so unmasked pixels stay exact through the VAE round
  trip. Stage the source and mask with _comfy.stage. In the route, refuse
  inpaint alongside scene/outfit/object plates (krea2edit regenerates the whole
  frame) and alongside style refs (style builds on the empty latent via
  target_latent). No web/ changes; the request body is unchanged. Verify first,
  in this order: (1) at the pinned COMFY_SHA, does SetLatentNoiseMask resize the
  mask to Krea 2's 5-D Wan21 latent [B,16,1,H/8,W/8]? (2) does VAEEncode on this
  VAE give the one-frame shape? (3) does one real render show V12 regional
  working with the noise mask? (4) is it better than the paste on Turbo's 8
  steps? Measure with does_it_help.py plus judge_renders.py rather than by eye.
  Add an inpaint graph case to tools/smoke_graphs.py."
findings:
  - "(1) Answered yes, on CPU, 2026-09-28, against ComfyUI 924743a. SetLatentNoiseMask
    stores [N,1,H,W] (nodes.py:1557); the sampler reshapes it with
    comfy.utils.reshape_mask (samplers.py:1308 -> utils.py:1348), whose dims == 3
    branch folds it to [1,1,T,H,W], interpolates trilinear to the latent's
    [T,H/8,W/8], repeats channels to 16 and repeats to batch. That body run on a
    1024x1536 mask gave (1,16,1,128,192) and (4,16,1,128,192) with coverage equal
    to the pixel mask's (0.1526), so RepeatLatentBatch needs no mask of its own."
  - "(2) Answered yes, by reading only. Krea 2's VAE takes the Wan 2.1 branch
    (sd.py:829), which leaves not_video False, so VAE.encode (sd.py:1358) turns
    one [1,H,W,3] image into [1,3,1,H,W] -> [1,16,1,H/8,W/8]. Caveat: a batched
    IMAGE would become frames of one video rather than a batch, so the source is
    encoded at batch 1 and RepeatLatentBatch makes the batch - which the remedy
    already says."
  - "(3) Answered yes, 2026-09-28, on an H100 with tools/ab_inpaint.py. Four
    regional inpaints through V12 with the noise mask, one of them at batch 2,
    all rendered with no error, and the batch gave two distinct takes."
  - "(4) Answered yes, same run: SAM masks on three Turbo renders, same seed and
    caption per pair, both arms pasted through the job's 5px feather. Seam
    excess over the source along the mask edge, mean of five pictures - paste
    edge +1.133 light +0.691, sampled edge +0.083 light -0.057; sampled lower
    on edge in 5 of 5 and on light in 4 of 5 (street, +0.091 against -0.029).
    Read by eye as well, because a render that changed nothing would also
    score a clean seam: every sampled edit is the asked-for thing lit like its
    room, where the paste left a ghost vase, a window-light patch on a chair,
    a slab of mismatched background behind a glass, and a haloed coat.
    judge_renders.py was not run: its rubric scores a picture against a brief,
    and the question here was the seam, which the numbers and the pairs
    answer."
evidence:
  kind: manual
  ref: "tools/ab_inpaint.py on 2026-09-28 against the working tree that became
    this commit; findings (3) and (4) above hold the numbers. tools/smoke_graphs.py
    passes with the 'krea2 inpaint' variant. Not yet deployed: the live app
    predates this and SAM, so the change reaches the page on the next modal
    deploy."
