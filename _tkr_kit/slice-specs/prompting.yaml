capability: prompting
slice_specs:
  - status: draft
    title: The scene composer — the contract it still owes
    purpose: "The composer is built, driven and read. What it does not have is a
      measurement, and one claim in it is load-bearing: that a scene assembled
      from cast, material and a timeline produces a better render than the same
      intent typed flat. Until that is measured the feature is asserted. This
      spec states the contract the composer must hold so the measurement in
      assurance/spec/13 can be run against it, and so a cast object survives the
      model swap it exists to survive."
    interface:
      - "`H3_CAST_KINDS` — the bucket vocabulary a cast member's reference slots
        are drawn from. Stable across model families; a new family maps onto it
        rather than extending it."
      - A cast member is `{handle, kind -> [reference files]}`, persisted under
        `characters/{handle}/` and served by `/api/characters` and
        `/api/character-file/{handle}/{name}`.
      - "`/api/compile` accepts a scene and returns the compiled document for
        the selected family, exactly as it does for a single shot — the composer
        adds no second compile path."
      - A shot in the timeline carries the same `prompt_typed` + `shot` pair a
        standalone render does, so a scene is a sequence of records, not a new
        record type.
    behavior:
      - "A cast member is bound to a person, not to a job: the same handle
        referenced from two shots resolves to one reference set."
      - Switching model family recompiles every shot in the scene from its typed
        intent. Nothing stored in the scene is family-specific.
      - A scene outlives a generation. Closing and reopening the page restores
        it; a completed render does not clear it.
      - Reference budget is enforced per shot at compile time, on CPU, before
        any job is spawned — a scene that would exceed twelve references for H3
        is refused with the shot named.
      - The composer produces no prompt the user is expected to read or edit. If
        a scene cannot be expressed through the vocabulary, that is a vocabulary
        gap, not a reason to expose the string.
    errors:
      - A cast handle referenced by a shot but absent from `characters/` — name
        the handle and the shot, do not silently drop the reference. A dropped
        reference renders something plausible and wrong, which is the worst
        available outcome.
      - A reference file that no longer exists on the volume — name the file and
        the cast slot; do not fall back to the remaining references, because a
        four-reference identity rendered from three is a different identity.
      - A scene exceeding the family's reference budget — refuse at compile time
        with the offending shot named and the budget stated. Never truncate.
    tests:
      - "smoke_scene.py: a scene of three shots against two cast members
        compiles to three documents, each carrying the cast's references, with
        no network and no GPU."
      - A scene compiled for H3 and then for Krea 2 yields two different
        documents from one unchanged stored scene — the family-independence
        check.
      - A cast handle deleted between compiles produces the named error rather
        than a render.
      - The measurement itself is assurance/spec/13; this slice is not done
        until that has run and its result is in the coverage ledger.
    data_lifecycle: "`characters/{handle}/` is a new store. Retention: op — deletion
      is operator-driven through the character routes, in the same shape as
      dataset and LoRA deletion, and reference files are the operator's own
      images. No automatic eviction: a cast member the user did not delete is a
      cast member they still want, and a scene that silently lost its references
      would render a different person."
    references:
      - web/src/scene
      - docs/roadmap.md
      - web/CLAUDE.md
    slice: 11
