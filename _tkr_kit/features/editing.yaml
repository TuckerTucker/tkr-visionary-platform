capability: editing
features:
  - name: scene-assembly
    status: done
    user_story: As someone who has rendered several takes of one scene, I want them
      to play and export as one cut, so that a scene longer than 14.4 seconds is
      a thing I have rather than a folder of clips.
    description: The first stage, and usable alone. The takes already recorded on
      the store become clips on V1 of an OpenVideo project kept in a scene
      folder on the volume. The IProject is the arrangement's only record from
      the first clip on — the scene folder's intent sidecars hold no trim, order
      or position, so there is never a second copy of V1 to disagree with it.
      Playback, trim, reorder, hard cuts with a crossfade available on any cut,
      and export in the page. Generation does not change.
    acceptance_criteria:
      - Continue twice, and the three takes are on V1 in order without any
        further gesture.
      - A trim or a reorder is reflected in playback on the next frame, with
        nothing re-fetched.
      - A cut is hard unless you give it a crossfade, and a crossfade is set per
        cut. A join made by Continue is already seamless — the pinned context is
        trimmed off at decode — so a crossfade there would overlap audio that
        already continues.
      - Export encodes in the page and the MP4 appears in the gallery as an
        output, through a route that writes outputs — never through /api/upload,
        which stages images into a training dataset.
      - In Firefox the scene previews and export is disabled with the reason on
        the control.
      - Closing and reopening the page restores the scene, its trims and its
        order.
    consumes_api:
      - /api/scenes/{id}
      - /api/outputs
      - /api/file/{job_id}/{name}
      - /api/gallery
    wiring_assignment:
      territory:
        - app.py
        - web/package.json
        - web/src/edit
        - web/src/store.ts
        - web/src/api
        - web/src/gallery
    evidence:
      kind: commit
      ref: "148583e: all 17 editing slices done; 22 UI checks and every smoke test
        pass on main"
  - name: tracks
    status: done
    user_story: As a director, I want a cutaway, a title and my own music over the
      scene, so that the scene is finished here rather than in another editor.
    description: Multi-track, on OpenVideo's arrangement as-is. A track is made by
      dropping something below the last one — your own footage, your own
      photographs, text, audio — never by an add-track button. An H3 take's
      soundtrack travels with its clip until you drag it onto an A track. Your
      own files are stored in the scene folder, not in a dataset, because a clip
      dropped on V2 is not training material and nothing should make it one by
      accident. The IProject's reader keeps every field it does not model.
    acceptance_criteria:
      - Dropping a file below V1 makes V2 and places it at the drop time;
        dropping audio makes an A track.
      - A take's soundtrack moves with its clip until it is detached, and
        detaching it is one drag and one undo.
      - Text clips (titles, lower thirds) are placed and styled on the canvas at
        the playhead, not in an inspector.
      - An arrangement saved at one pinned OpenVideo version reloads with every
        field intact, including ones the page does not read.
      - No surface offers browsing or searching media that is not yours.
      - A dropped file lands in scenes/{id}/media and appears in no dataset.
    consumes_api:
      - /api/scenes/{id}/media
    wiring_assignment:
      territory:
        - web/src/edit
        - web/src/media
        - app.py
    evidence:
      kind: commit
      ref: "148583e: all 17 editing slices done; 22 UI checks and every smoke test
        pass on main"
  - name: generative-commands
    status: done
    user_story: As someone editing a scene, I want rendering a shot to be an edit
      like any other, so that undo reaches it and nothing asks me whether I am
      sure.
    description: slot.render, take.choose and slot.continue registered as OpenVideo
      custom commands, each one a normal Visionary job over /api/video,
      /api/status and /api/stop. A slot's takes step with the same ‹ 1 / 4 › the
      canvas already uses for a batch. A slot is one generation and holds the
      shots rendered in it — the `[Shot N]` cuts H3 makes inside one take — so
      scene/Timeline.tsx's shot bars move inside the V1 slots and its break mark
      becomes the slot boundary, rather than each shot becoming a generation of
      its own and losing the cuts the model makes for free. A shot longer than
      one generation spans several slots chained by Continue, re-anchored from
      the cast's references at an interval named beside H3MC_CONTEXT_FRAMES,
      because the pack's own README says quality compounds down a chain and
      audio dulls first. Continue from a trimmed take cuts the saved motion
      latent at the out-point on the server, so motion and audio still continue
      from where the cut is rather than from a still.
    acceptance_criteria:
      - Undo after a render returns the slot to its previous take; the bytes of
        the undone take stay on the volume.
      - A trim followed by a render undoes in that order from one history.
      - No scene action asks for confirmation; undo is the recovery for every
        one of them.
      - "There is one timeline on screen: the shot bars sit inside the V1 slot
        that renders them."
      - A slot whose prose names three shots renders as one take with its three
        cuts, not as three takes.
      - A 30-second shot renders as three chained takes that play as one clip on
        V1, and the chain re-anchors from references at the named interval.
      - Continue from a trimmed take carries motion and audio from the
        out-point, snapped to the latent's frame grid with the snap shown on the
        slot; with no saved latent it opens on the frame at the out-point and
        says so.
    consumes_api:
      - /api/video
      - /api/status/{job_id}
      - /api/stop/{job_id}
      - /api/compile
    wiring_assignment:
      territory:
        - web/src/edit
        - web/src/scene
        - web/src/video
        - web/src/canvas
        - app.py
    evidence:
      kind: commit
      ref: "148583e: all 17 editing slices done; 22 UI checks and every smoke test
        pass on main"
  - name: cross-track-context
    status: done
    user_story: As a director cutting away mid-scene, I want the insert to know
      which scene it is in, so that I never rebuild the cast and the look for a
      three-second cutaway.
    description: "The part neither system has on its own. A slot dropped on V2 over
      V1 inherits the cast, look and LoRAs of the V1 slot it covers and can take
      V1's frame at that time as a reference — marked inherited, and cheap to
      drop. Re-rendering a slot marks what was conditioned on it as stale: the
      slots chained after it on its track, and the overlays that took a frame
      from it."
    acceptance_criteria:
      - An empty slot on V2 at 0:12 opens with the cast of the V1 slot under
        0:12, each inherited item marked as inherited.
      - Dropping an inherited item is one gesture and does not affect the V1
        slot.
      - Re-rendering V1 slot 2 marks V1 slot 3 and any V2 overlay conditioned on
        slot 2 as stale, and export names the stale slots before it encodes.
      - A stale slot offers to re-render from the new cut; it is never
        re-rendered on its own.
    consumes_api:
      - /api/video
      - /api/characters
    wiring_assignment:
      territory:
        - web/src/edit
        - web/src/scene
        - web/src/video
    evidence:
      kind: commit
      ref: "148583e: all 17 editing slices done; 22 UI checks and every smoke test
        pass on main"
  - name: one-canvas
    status: done
    user_story: As someone making one image, I want to finish and leave without
      learning that motion exists, and as someone making a film I want the same
      surface to hold it.
    description: "The Pixi stage becomes the canvas for both domains. A still is a
      zero-duration scene: one slot and no time axis until time is added.
      Regions draw over the frame at the playhead and belong to the still slot
      under it. /api/video takes no regions, so over a video slot the region
      tool is shown disabled with that reason rather than drawing boxes nothing
      will read."
    acceptance_criteria:
      - A first-run image session shows no timeline and no track.
      - The canvas behaviours already specified in web/CLAUDE.md — a render
        replaced when the next lands, a click addressing what is under it, the
        30% console budget — hold on the Pixi stage.
      - Regions drawn at the playhead apply to the still slot under it and move
        with that slot.
      - Over a video slot the region tool is disabled and says H3 takes no
        regions.
      - Stepping a batch still costs a compositor frame and re-fetches nothing.
    consumes_api:
      - /api/generate
    wiring_assignment:
      territory:
        - web/src/edit
        - web/src/canvas
        - web/src/regions
    evidence:
      kind: commit
      ref: "148583e: all 17 editing slices done; 22 UI checks and every smoke test
        pass on main"
