      - web/src/blocking-main.tsx
      - web/src/store.ts
      - web/src/icons.tsx
      - web/src/format.ts
      - web/src/ui
      - web/src/api
      - web/src/ds
      - web/src/styles
      - web/src/blocking
      - web/index.html
      - web/blocking.html
      - web/package.json
      - web/vite.config.ts
      - web/vite.lib.config.ts
      - web/build-ds.mjs
      - web/tsconfig.json
      - web/tsconfig.ds.json
      - tools/preview_ui.py
    description: "The page: React and TypeScript built into the image at deploy
      time, so `modal deploy app.py` stays the whole install and no local Node
      is needed to ship. One canvas at a time; options in a bar under the
      picture, never a rail beside it."
    scope_in:
      - The canvas as the largest thing on screen, always. A batch is frames of
        film — each result fills the canvas and steps between them — rather than
        a contact sheet.
      - "A render replaced when the next one lands, not when it is asked for:
        two ids on the run record, so the shot you are judging survives the
        length of the next run."
      - The console sorted by how often you reach for something, and by nothing
        else. The button is named for the model, because the model is the
        rarely-touched choice that decides what every frequently-touched one
        means.
      - A click addresses whatever is under it — over a region it opens that
        region, over bare picture it does nothing.
      - "everyMs rather than setInterval: a poll waits for its own reply,
        because at 400ms against a network Dict a slow answer overlaps the next
        tick and the polls in flight starve the media coming off the same
        origin."
      - Shared primitives (Masonry, Popover, Sheet, Menu, NumInput, ErrorNote,
        gesture), the named route map, the design tokens.
      - tools/preview_ui.py — the real prompt compilers and shot vocabulary
        against stubbed jobs, so the whole UI is workable with no Modal account,
        no GPU and nothing billed.
    scope_out:
      - A settings rail beside the canvas. The picture is height-bound at every
        render aspect on a laptop, so a bar always comes out of the picture
        while four of five aspects leave room for a rail twice over — but the
        axis that is free depends on the render, not on taste.
      - "Floating the console over the picture. Built and rejected: a backdrop
        blur means judging a render through something, and its legibility then
        depends on what you generated."
      - Mounting the front end from disk at runtime. It is built into the image;
        Node is a build-time dependency only.
      - Toasts, are-you-sure dialogs, and console-only errors.
    acceptance_criteria:
      - npm run dev in web/ proxies to the preview server and the entire UI is
        workable offline.
      - A clip that lands plays muted and looping; the soundtrack is one tap
        away on the native controls.
      - Nothing sized to the canvas uses a dvh sum — it measures the canvas,
        because the bar grows.
    evidence:
      kind: manual
      ref: "As-built: recorded on 2026-08-31 by reading the shipped code at 860d615.
        Every slice under it reads done, and its territory (web/src/App.tsx,
        web/src/main.tsx, web/src/blocking-main.tsx…) is present in the tree.
        Covered by tools/ui-checks."
