capability: editing
slices:
  - number: 1
    feature: scene-assembly
    delivers: "@openvideo/core and @openvideo/engine-pixi at exact versions with the
      lockfile's integrity hashes, built into the image with the rest of web/.
      Both are published from the scenify/scenify monorepo, where a commit SHA
      would mean building the packages from source; a published npm version
      cannot be re-pointed, which is what a SHA buys elsewhere. When upstream
      force-pushes, the build does not change under us, and nothing at runtime
      needs Node."
    paths:
      - web/package.json
      - web/package-lock.json
      - web/vite.config.ts
      - web/index.html
      - web/src/edit/engine.ts
      - tools/smoke_pins.py
    depends_on:
      - 17
    story_ids:
      - cut-several-takes-into-one-scene
    title: OpenVideo pinned into the image build
    layer: integration
    status: planned
  - number: 2
    feature: scene-assembly
    delivers: scenes/{id}/ holding the intent sidecars, beside the takes they
      reference by job and file, read and written through /api/scenes/{id}.
      Intent only — no trim, order or position, which are the IProject's (slice
      10). The route is behind the password by existing; the reader keeps every
      field it does not model, because a sidecar is read years after it is
      written.
    paths:
      - app.py
      - tools/preview_ui.py
      - tools/smoke_scenes.py
      - web/src/api
      - web/src/store.ts
      - web/src/edit/persist.ts
    depends_on:
      - 17
    story_ids:
      - cut-several-takes-into-one-scene
    title: A scene folder on the volume, and the route that reads and writes it
    layer: data
    status: planned
  - number: 3
    feature: scene-assembly
    delivers: The store's `takes` compiled into an IProject on V1 and played on the
      OpenVideo stage, saved through slice 10's store from the first clip.
      Continue appends; nothing else has to be done for a take to be in the cut.
    paths:
      - web/src/edit/project.ts
      - web/src/edit/useEdit.ts
      - web/src/edit/Stage.tsx
      - web/src/edit/Tracks.tsx
      - web/src/edit/Clip.tsx
      - web/src/edit/edit.css
      - web/src/store.ts
      - web/src/video/useVideo.ts
      - web/src/App.tsx
      - tools/ui-checks/check_edit.py
    depends_on:
      - 1
      - 2
      - 10
    story_ids:
      - cut-several-takes-into-one-scene
    title: Takes become V1 clips on the Pixi stage
    layer: ui
    status: planned
  - number: 4
    feature: scene-assembly
    delivers: In and out points and order, on the track. Cuts are hard by default,
      and any cut can be given a crossfade. A join made by Continue is already
      seamless — the pinned context is trimmed off at decode — so a default
      crossfade would overlap audio that already continues.
    paths:
      - web/src/edit/Tracks.tsx
      - web/src/edit/Clip.tsx
      - web/src/edit/cuts.ts
      - web/src/edit/tracks.css
    depends_on:
      - 3
    story_ids:
      - cut-several-takes-into-one-scene
    title: Trim, reorder, and a crossfade on any cut
    layer: ui
    status: planned
  - number: 5
    feature: scene-assembly
    delivers: WebCodecs encodes the cut in the browser and POST /api/outputs writes
      the MP4 into a job directory of its own, so it is found where every render
      is. /api/upload is not the route — it stages images into a training
      dataset. Progress says which clip it is encoding. In Firefox the control
      is disabled with the reason on it, not hidden and not failing after the
      press.
    paths:
      - app.py
      - tools/preview_ui.py
      - tools/smoke_outputs.py
      - web/src/api
      - web/src/gallery
      - web/src/edit/export.ts
      - web/src/edit/Export.tsx
    depends_on:
      - 3
    story_ids:
      - cut-several-takes-into-one-scene
    title: Export in the page, landing in the gallery
    layer: ui
    status: planned
  - number: 6
    feature: tracks
    delivers: "Dropping below the last track makes one of the right kind at the drop
      time: footage and photographs on V, text on T, audio on A. There is no
      add-track button and no media browser; the files are yours. They land in
      scenes/{id}/media through /api/scenes/{id}/media, never in a dataset — a
      clip dropped on V2 is not training material."
    paths:
      - app.py
      - tools/preview_ui.py
      - tools/smoke_scenes.py
      - web/src/api
      - web/src/media
      - web/src/edit/drop.ts
      - web/src/edit/DropZone.tsx
    depends_on:
      - 4
    story_ids:
      - finish-a-scene-with-my-own-material-over-it
    title: Tracks made by a drop — your media, text, audio
    layer: ui
    status: planned
  - number: 7
    feature: generative-commands
    delivers: Each one an ordinary Visionary job over /api/video, /api/status and
      /api/stop, registered through OpenVideo's custom-commands API so
      generation is an edit. A slot keeps every take it has had and steps them
      with ‹ 1 / 4 ›.
    paths:
      - web/src/edit/commands.ts
      - web/src/edit/slots.ts
      - web/src/edit/Slot.tsx
      - web/src/video/useVideo.ts
    depends_on:
      - 3
    story_ids:
      - render-a-shot-as-an-edit
    title: slot.render, take.choose and slot.continue as custom commands
    layer: api
    status: planned
  - number: 8
    feature: one-canvas
    delivers: "A still is a zero-duration scene: one slot and no time axis until
      time is added. The canvas rules already in web/CLAUDE.md hold on the new
      stage — replaced when the next lands, a click addresses what is under it,
      the console budget."
    paths:
      - web/src/canvas
      - web/src/edit/Stage.tsx
    depends_on:
      - 3
    story_ids:
      - make-one-image-without-meeting-a-timeline
    title: The Pixi stage is the canvas for stills too
    layer: ui
    status: planned
  - number: 9
    feature: tracks
    delivers: Picture and sound arrive together from H3 and stay linked; dragging
      the soundtrack onto an A track detaches it, and one undo re-links it.
    paths:
      - web/src/edit/detach.ts
      - web/src/edit/Clip.tsx
    depends_on:
      - 6
    story_ids:
      - finish-a-scene-with-my-own-material-over-it
    title: A take's soundtrack travels with it until detached
    layer: ui
    status: planned
  - number: 10
    feature: scene-assembly
    delivers: OpenVideo's project JSON written verbatim into the scene folder,
      tagged with the pinned @openvideo/core version it was written at, and
      linked to the intent sidecars by slot id. It is the arrangement's only
      record from the first clip on V1, so there is never a second copy to
      disagree with it. Reloading at the same pin loses no field.
    paths:
      - app.py
      - tools/preview_ui.py
      - tools/smoke_scenes.py
      - web/src/api
      - web/src/edit/persist.ts
    depends_on:
      - 1
      - 2
    story_ids:
      - cut-several-takes-into-one-scene
    title: The arrangement stored as a pinned IProject
    layer: data
    status: planned
  - number: 11
    feature: generative-commands
    delivers: Trim, reorder, choose a take and render all undo from one history.
      Undoing a render returns the previous take and leaves the bytes on the
      volume. No scene action asks for confirmation; undo is the recovery.
    paths:
      - web/src/edit/history.ts
      - web/src/edit/UndoBar.tsx
    depends_on:
      - 4
      - 7
    story_ids:
      - render-a-shot-as-an-edit
    title: One undo stack for every scene edit
    layer: ui
    status: planned
  - number: 12
    feature: generative-commands
    delivers: "Continue carries motion and audio from the out-point, not the file's
      end — a take trimmed because its last second went wrong should not be
      continued from that second. The saved latent (H3MC_SIDECAR) is cut on the
      server so its context window ends at the out-point, snapped to the
      latent's frame grid and to the 40 Hz audio grid, with the snap shown on
      the slot. Without a saved latent it degrades to the frame at the
      out-point, read with extractFrame, and says it did; with no frame either,
      the next take opens cold."
    paths:
      - app.py
      - tools/smoke_graphs.py
      - web/src/video
      - web/src/edit/continue.ts
    depends_on:
      - 4
      - 7
    story_ids:
      - render-a-shot-as-an-edit
    title: Continue from the out-point
    layer: ui
    status: planned
  - number: 13
    feature: generative-commands
    delivers: One timeline on screen. A slot is one generation and holds the shots
      rendered in it, so scene/Timeline.tsx's shot bars move inside the V1 slots
      and its break mark becomes the slot boundary — the `[Shot N]` cuts H3
      makes inside one take stay one take. A shot longer than H3's cap spans
      several takes chained by Continue that play as one clip, re-anchored from
      the cast's references at an interval named beside H3MC_CONTEXT_FRAMES,
      because the pack's README says quality compounds down a chain and audio
      dulls first.
    paths:
      - app.py
      - tools/preview_ui.py
      - web/src/scene/Timeline.tsx
      - web/src/scene/Shots.tsx
      - web/src/edit/Slot.tsx
    depends_on:
      - 7
      - 12
    story_ids:
      - render-a-shot-as-an-edit
    title: The shot bars live inside the V1 slots
    layer: ui
    status: planned
  - number: 14
    feature: cross-track-context
    delivers: A slot on V2 over V1 opens with the covered slot's cast, look and
      LoRAs, and can take V1's frame at that time as a reference. Each inherited
      item is marked inherited and dropping one is one gesture.
    paths:
      - web/src/edit/inherit.ts
      - web/src/edit/Inherited.tsx
    depends_on:
      - 6
      - 7
    story_ids:
      - cut-away-without-rebuilding-the-scene
    title: Inserts inherit the scene they cover
    layer: ui
    status: planned
  - number: 15
    feature: cross-track-context
    delivers: Re-rendering a slot marks the slots chained after it on its track, and
      the overlays that took a frame from it, as stale. Export names stale slots
      before encoding; a stale slot offers to re-render from the new cut and
      never does it on its own.
    paths:
      - web/src/edit/stale.ts
      - web/src/edit/Export.tsx
    depends_on:
      - 5
      - 12
      - 14
    story_ids:
      - cut-away-without-rebuilding-the-scene
    title: Staleness along chains and overlays
    layer: ui
    status: planned
  - number: 16
    feature: one-canvas
    delivers: Regions belong to the still slot under the playhead and move with it.
      /api/video takes no regions, so over a video slot the region tool is shown
      disabled with that reason rather than drawing boxes nothing will read.
    paths:
      - web/src/regions
    depends_on:
      - 8
    story_ids:
      - make-one-image-without-meeting-a-timeline
    title: Regions over the frame at the playhead
    layer: ui
    status: planned
  - number: 17
    feature: scene-assembly
    delivers: web/CLAUDE.md's 'past a scene you are in an NLE and out of scope'
      replaced by the editing scope, keeping the frame/shot/scene argument for
      why generation stops at a take; docs/roadmap.md gains the editing phase. A
      rule that no longer holds and is still in context vetoes the work it
      describes, which is why slices 1 and 2 depend on this one.
    paths:
      - web/CLAUDE.md
      - docs/roadmap.md
    depends_on: []
    story_ids:
      - cut-several-takes-into-one-scene
    title: The rules that multi-track editing overrides
    layer: domain
    status: done
