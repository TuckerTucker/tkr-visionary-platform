    data_surface:
      - field: hf_token
        purpose: authenticate downloads of gated model weights from HuggingFace on the
          owner's behalf
        retention: replace-on-write in a Modal Dict; cleared by saving an empty value;
          never written to the volume, a log or a sidecar
        lawful_basis: the deployment is single-user and self-hosted — the credential is
          the operator's own, supplied to their own instance for the sole
          purpose of fetching weights they have licensed
        provision: "out of scope for PIPEDA/GDPR triage: no third party's personal data
          is involved, and the token never leaves the operator's own Modal
          account"
    new_stores:
      - name: hf-token-dict
        retention:
          kind: bounded
          detail: "replace-on-write: one key, overwritten by /api/token, never appended
            to"
